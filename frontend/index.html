    <script type="module">
        const htmlEl = document.documentElement;
        const themeBtn = document.getElementById('theme-toggle');
        const copyTagBtn = document.getElementById('copyTag');
        const topButtonEl = document.getElementById('top-button');



        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 55;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        composer.addPass(bloomPass);

        const COUNT = 20000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(COUNT * 3);
        const colors = new Float32Array(COUNT * 3);
        const sizes = new Float32Array(COUNT);

        const targetPositions = new Float32Array(COUNT * 3);
        const targetColors = new Float32Array(COUNT * 3);
        const targetSizes = new Float32Array(COUNT);

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        const particles = new THREE.Points(geometry, new THREE.PointsMaterial({ size: 0.3, vertexColors: true, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
        scene.add(particles);



        let currentTech = 'neutral';
        let shakeIntensity = 0;
        let update = false;
        let stompClient = null;
        let isReady = false;
        let selectedQuestionCount = null;
        let currentQuestion = null;
        let currentQuestionId = null;
        let isAnswerSent = false;
        let timerIntervalId = null;
        let timeLeft = 0;
        let selectedOptionId = null;
        let questionIndex = 1;
        let isGameAvailable = false;
        let GAME_RESULT = null;
        let GLOBAL_LEADERBOARD = null;
        let currentTopMode = 'GAME';

        const preloginScreenEl = document.getElementById('prelogin-screen');
        const preloginStartEl = document.getElementById('prelogin-start');
        const preloginLink1El = document.getElementById('prelogin-link-1');

        topButtonEl.addEventListener('click', () => {
            if (!Array.isArray(GLOBAL_LEADERBOARD)) {

        copyTagBtn.addEventListener('click', () => {
            const tagElement = document.getElementById('hashtag-text');
            const originalText = '#MathJackbox';

            try {
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(originalText);
                } else {
                    const textArea = document.createElement("textarea");
                    textArea.value = originalText;
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                }

                tagElement.classList.remove('gradient-tag');
                tagElement.classList.add('text-green-500', 'font-bold');
                tagElement.innerText = '✓ Скопировано!';

                setTimeout(() => {
                    tagElement.classList.remove('text-green-500', 'font-bold');
                    tagElement.classList.add('gradient-tag');
                    tagElement.innerText = originalText;
                }, 2000);

            } catch (err) {
                console.error('Ошибка копирования:', err);
            }
        });

        async function fetchGameData() {
            try {
                const data = { available: true, game: null };

                isGameAvailable = data.available;
                const overlay = document.getElementById('game-overlay');

                if (isGameAvailable) {
                    overlay.classList.remove('opacity-100', 'pointer-events-auto');
                    overlay.classList.add('opacity-0', 'pointer-events-none');
                } else {
                    overlay.classList.remove('opacity-0', 'pointer-events-none');
                    overlay.classList.add('opacity-100', 'pointer-events-auto');
                }
            } catch (error) {
                console.error("Ошибка получения данных игры:", error);
            }
        }

        setInterval(fetchGameData, 1000);
        fetchGameData();



        function isMobile() {
            return /Mobi|Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i
                .test(navigator.userAgent);
        }

        function getRed(i) {
            if (i < COUNT * 0.1) {
                const r = Math.random() * 9;
                const theta = Math.random() * 6.28; const phi = Math.acos(2 * Math.random() - 1);
                return { x: r * Math.sin(phi) * Math.cos(theta), y: r * Math.sin(phi) * Math.sin(theta), z: r * Math.cos(phi), r: 3, g: 0.1, b: 0.1, s: 2.5 };
            } else {
                const armCount = 3; const t = (i / COUNT);
                const angle = t * 15 + ((i % armCount) * (Math.PI * 2 / armCount));
                const radius = 2 + (t * 40);
                return { x: radius * Math.cos(angle), y: radius * Math.sin(angle), z: (Math.random() - 0.5) * (10 * t), r: 0.8, g: 0, b: 0, s: 1.0 };
            }
        }

        function getVoid(i) {
            if (i < COUNT * 0.15) {
                const angle = Math.random() * Math.PI * 2;
                return { x: 26 * Math.cos(angle), y: 26 * Math.sin(angle), z: (Math.random() - 0.5) * 1, r: 1, g: 1, b: 1, s: 2.5 };
            } else {
                const radius = 30 + Math.random() * 90;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                return { x: radius * Math.sin(phi) * Math.cos(theta), y: radius * Math.sin(phi) * Math.sin(theta), z: radius * Math.cos(phi), r: 0.1, g: 0.6, b: 1.0, s: 0.7 };
            }
        }

        function getPurple(i) {
            if (Math.random() > 0.8) return { x: (Math.random() - 0.5) * 100, y: (Math.random() - 0.5) * 100, z: (Math.random() - 0.5) * 100, r: 0.5, g: 0.5, b: 0.7, s: 0.8 };
            const r = 20; const theta = Math.random() * Math.PI * 2; const phi = Math.acos(2 * Math.random() - 1);
            return { x: r * Math.sin(phi) * Math.cos(theta), y: r * Math.sin(phi) * Math.sin(theta), z: r * Math.cos(phi), r: 0.6, g: 0.5, b: 1.0, s: 2.5 };
        }

        function getShrine(i) {
            const total = COUNT;
            if (i < total * 0.3) return { x: (Math.random() - 0.5) * 80, y: -15, z: (Math.random() - 0.5) * 80, r: 0.4, g: 0, b: 0, s: 0.8 };
            else if (i < total * 0.4) {
                const px = ((i % 4) < 2 ? 1 : -1) * 12; const pz = ((i % 4) % 2 == 0 ? 1 : -1) * 8;
                return { x: px + (Math.random() - 0.5) * 2, y: -15 + Math.random() * 30, z: pz + (Math.random() - 0.5) * 2, r: 0.2, g: 0.2, b: 0.2, s: 0.6 };
            } else if (i < total * 0.6) {
                const t = Math.random() * Math.PI * 2; const rad = Math.random() * 30;
                const curve = Math.pow(rad / 30, 2) * 10;
                return { x: rad * Math.cos(t), y: 15 - curve + (Math.random() * 2), z: rad * Math.sin(t) * 0.6, r: 0.6, g: 0, b: 0, s: 0.6 };
            } else return { x: 0, y: 0, z: 0, r: 0, g: 0, b: 0, s: 0 };
        }

        async function updateState(tech) {
            currentTech = tech;
            shakeIntensity = tech !== 'neutral' ? 0.4 : 0;

            if (tech === 'off') {
                bloomPass.strength = 0.0;

                for (let i = 0; i < COUNT; i++) {
                    targetPositions[i * 3] = 0;
                    targetPositions[i * 3 + 1] = 0;
                    targetPositions[i * 3 + 2] = 0;

                    targetColors[i * 3] = 0;
                    targetColors[i * 3 + 1] = 0;
                    targetColors[i * 3 + 2] = 0;

                    targetSizes[i] = 0;
                }
                setTimeout(() => { renderer.domElement.style.display = 'none'; }, 300);

                return;
            }

            if (tech === 'shrine') { bloomPass.strength = 2.5; }
            else if (tech === 'purple') { bloomPass.strength = 4.0; }
            else if (tech === 'void') { bloomPass.strength = 2.0; }
            else if (tech === 'red') { bloomPass.strength = 2.5; }
            else { bloomPass.strength = 1.0; }

            for (let i = 0; i < COUNT; i++) {
                let p;
                if (tech === 'neutral') {
                    if (i < COUNT * 0.05) {
                        const r = 15 + Math.random() * 20; const t = Math.random() * 6.28; const ph = Math.random() * 3.14;
                        p = { x: r * Math.sin(ph) * Math.cos(t), y: r * Math.sin(ph) * Math.sin(t), z: r * Math.cos(ph), r: 0.1, g: 0.1, b: 0.2, s: 0.4 };
                    } else p = { x: 0, y: 0, z: 0, r: 0, g: 0, b: 0, s: 0 };
                }
                else if (tech === 'red') p = getRed(i);
                else if (tech === 'void') p = getVoid(i);
                else if (tech === 'purple') p = getPurple(i);
                else if (tech === 'shrine') p = getShrine(i);

                targetPositions[i * 3] = p.x; targetPositions[i * 3 + 1] = p.y; targetPositions[i * 3 + 2] = p.z;
                targetColors[i * 3] = p.r; targetColors[i * 3 + 1] = p.g; targetColors[i * 3 + 2] = p.b;
                targetSizes[i] = p.s;
            }
        }

        async function animate() {
            requestAnimationFrame(animate);

            if (shakeIntensity > 0) {
                renderer.domElement.style.transform = `translate(${(Math.random() - 0.5) * shakeIntensity * 40}px, ${(Math.random() - 0.5) * shakeIntensity * 40}px)`;
            } else {
                renderer.domElement.style.transform = 'translate(0,0)';
            }

            const pos = particles.geometry.attributes.position.array;
            const col = particles.geometry.attributes.color.array;
            const siz = particles.geometry.attributes.size.array;

            for (let i = 0; i < COUNT * 3; i++) {
                pos[i] += (targetPositions[i] - pos[i]) * 0.1;
                col[i] += (targetColors[i] - col[i]) * 0.1;
            }
            for (let i = 0; i < COUNT; i++) siz[i] += (targetSizes[i] - siz[i]) * 0.1;

            particles.geometry.attributes.position.needsUpdate = true;
            particles.geometry.attributes.color.needsUpdate = true;
            particles.geometry.attributes.size.needsUpdate = true;

            if (currentTech === 'red') {
                particles.rotation.z -= 0.1;
            } else if (currentTech === 'purple') {
                particles.rotation.z += 0.2;
                particles.rotation.y += 0.05;
            } else if (currentTech === 'shrine') {
                particles.rotation.set(0, 0, 0);
            } else if (currentTech === '') {
                particles.rotation.y += 0.005;
            }

            composer.render();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        async function display() {
            renderer.domElement.style.display = 'block';
            if (!update) {
                let temp = Math.floor(Math.random() * 4);
                update = true;
                switch (temp) {
                    case 0: currentTech = 'void'; break;
                    case 1: currentTech = 'red'; break;
                    case 2: currentTech = 'purple'; break;
                    case 3: currentTech = 'shrine'; break;
                }
                await updateState(currentTech);
                currentTech = '';
                updateState(currentTech);
            }
        }

        if (!isMobile()) {
            updateState(currentTech);
            animate();
            display();
        }



        async function reg_nickname() {
            const nickname = nicknameInputEl.value.trim();
            if (!nickname) {
                alert('Пожалуйста, введи никнейм!');
                nicknameInputEl.focus();
                return;
            }
            register(nickname, true)
        }

        async function reg_guest() {
            register("", false);
        }

        function handleUserReply(data) {
            if (!data || !data.type) {
                console.warn('Неизвестный ответ от /queue/reply:', data);
                return;
            }
            if (data.type === 'ERROR') {
                showRegisterError(data.message || 'Произошла ошибка при входе');
                questionContainerEl.classList.add('hidden');
                registerScreenEl.classList.remove('hidden');
                return;
            }

            if (data.type === 'REGISTER_SUCCESS' || data.type === 'GUEST_SUCCESS') {
                if (data.secretToken) {
                    localStorage.setItem('quiz_secret_token', data.secretToken);
                }
                window.playerNickname = data.nickname;

                registerScreenEl.classList.add('hidden');
                questionContainerEl.classList.remove('hidden');
                questionTextEl.textContent = 'Загрузка вопроса...';
                questionTimerEl.textContent = '';
                answersEl.innerHTML = '';
                showReadyOverlay();

                return;
            }

            console.warn('Неизвестный тип ответа:', data.type, data);
        }

        function showRegisterError(message) {
            if (!errorBoxEl) {
                alert(message);
                return;
            }
            errorBoxEl.textContent = message;
            errorBoxEl.classList.remove('hidden');
            setTimeout(() => { errorBoxEl.classList.add('hidden'); }, 5000);
        }

        async function register(nickname, type) {
            if (errorBoxEl) {
                errorBoxEl.textContent = '';
                errorBoxEl.classList.add('hidden');
            }

            connect(nickname, type);
        }



        async function connect(nickname, type) {
            stompClient = new window.StompJs.Client({
                brokerURL: 'ws://91.144.171.134:8080/ws',
            });

            stompClient.onConnect = (frame) => {
                console.log('Подключено к WebSocket как:', nickname);

                stompClient.subscribe('/user/queue/reply', (message) => {
                    try {
                        let payload = JSON.parse(message.body);
                        handleUserReply(payload);
                        console.log('MESSAGE /user/queue/reply RAW:', payload.type);
                    } catch (e) {
                        console.error('Ошибка парсинга /user/queue/reply:', e, message.body);
                        return;
                    }
                });

                if (type) {
                    stompClient.publish({
                        destination: '/app/register',
                        body: JSON.stringify({ nickname: nickname })
                    });
                } else {
                    stompClient.publish({
                        destination: '/app/join-guest',
                        body: JSON.stringify({ nickname })
                    })
                }
            };

            stompClient.onStompError = (frame) => {
                console.error('STOMP error:', frame.headers['message'], frame.body);
            };

            stompClient.activate();
        }

        async function subscribe() {
            console.log("Успешно подключено к WebSocket!");
            stompClient.subscribe('/topic/game', (message) => {
                updateState('neutral');
                setTimeout(() => { currentTech = 'off'; updateState(currentTech); }, 300);
                const data = JSON.parse(message.body);

                if (data.type === 'NEW_QUESTION') {
                    questionIndex += 1;
                    loadQuestion(data);
                    hideReady();
                    questionTimerEl.classList.remove('hidden');
                    topButtonEl.classList.add('hidden');
                } else if (data.type === 'GAME_RESULT') {
                    GAME_RESULT = data.scores;
                    tryShowTop();
                    questionIndex = 0;
                    return;
                } else if (data.type === 'GLOBAL_LEADERBOARD') {
                    GLOBAL_LEADERBOARD = data.leaderboard;
                    tryShowTop();
                    questionIndex = 0;
                    return;
                }
            });
        }



        function showReadyOverlay() {
            isReady = false;
            readyBtnEl.textContent = 'Я готов 👉👈';
            readyBtnEl.disabled = false;
            readyBtnEl.classList.remove('bg-gray-500');
            readyBtnEl.classList.add('bg-emerald-600');
            readyOverlayEl.classList.remove('hidden');

            if (questionSettingsEl) {
                questionSettingsEl.querySelectorAll('.q-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const count = parseInt(btn.dataset.count, 10);
                        selectedQuestionCount = count;

                        questionSettingsEl.querySelectorAll('.q-btn').forEach(b => {
                            b.classList.remove('bg-emerald-600', 'text-white');
                        });
                        btn.classList.add('bg-emerald-600', 'text-white');

                        if (stompClient && stompClient.connected) {
                            stompClient.publish({
                                destination: '/app/settings',
                                body: JSON.stringify({ questionCount: count })
                            });
                        } else {
                            console.warn('stompClient не подключен, настройки вопросов не отправлены');
                        }
                    });
                });
            }
        }

        function sendReady() {
            if (isReady) return;
            isReady = true
            readyBtnEl.textContent = 'Ожидаем других...';
            readyBtnEl.disabled = true;
            readyBtnEl.classList.remove('bg-emerald-600');
            readyBtnEl.classList.add('bg-gray-500');

            if (stompClient && stompClient.connected) {
                stompClient.publish({
                    destination: '/app/ready'
                });

                hideReady();
                subscribe();
            } else {
                console.warn('stompClient не подключен, не могу отправить /app/ready');
            }
        }

        function hideReady() {
            readyOverlayEl.classList.add('hidden');
        }

        async function loadQuestion(data) {
            try {
                if (!data || !data.text) {
                    console.error('Некорректные данные вопроса:', data);
                    questionTextEl.textContent = 'Вопросы закончились';
                    answersEl.innerHTML = '';
                    questionTimerEl.textContent = '';
                    return;
                }

                currentQuestionId = null;
                currentQuestion = {
                    ...data,
                    time_left: data.secondsLeft
                };
                isAnswerSent = false;
                selectedOptionId = null;

                if (timerIntervalId) {
                    clearInterval(timerIntervalId);
                    timerIntervalId = null;
                }

                questionIndexEl.textContent = `Вопрос ${questionIndex}`;
                questionTextEl.textContent = data.text;
                timeLeft = data.secondsLeft ?? 0;
                timeLeft -= 1;
                questionTimerEl.textContent = `00:${String(timeLeft).padStart(2, '0')}`;

                // 4 кнопки
                answersEl.innerHTML = '';
                data.options.forEach((optionText, idx) => {
                    const optionId = String(idx);
                    const btn = document.createElement('button');

                    btn.type = 'button';
                    btn.textContent = optionText;
                    btn.className =
                        'w-full py-3 px-4 rounded-xl border border-gray-200 dark:border-gray-700 ' +
                        'bg-gray-50 dark:bg-gray-700 hover:bg-blue-50 dark:hover:bg-blue-900/40 ' +
                        'text-left transition flex items-center gap-3';
                    btn.dataset.optionId = optionId;
                    btn.onclick = () => handleAnswerClick(optionId, btn);

                    answersEl.appendChild(btn);
                });

                timerIntervalId = setInterval(() => {
                    if (timeLeft <= 0) {
                        clearInterval(timerIntervalId);
                        timerIntervalId = null;
                        onTimeExpired();
                        return;
                    }
                    timeLeft -= 1;
                    questionTimerEl.textContent = `00:${String(timeLeft).padStart(2, '0')}`
                }, 1000);
            } catch (err) {
                console.error('Ошибка загрузки вопроса:', err);
            }
        }

        async function onTimeExpired() {
            const buttons = answersEl.querySelectorAll('button');

            buttons.forEach(b => {
                const id = b.dataset.optionId;

                if (id === currentQuestion.correct_option_id) {
                    b.classList.remove('border-blue-500', 'bg-blue-50', 'dark:bg-blue-900/40');
                    b.classList.add('border-green-500', 'bg-green-50', 'dark:border-green-900/40', 'dark:bg-green-900/40');
                }

                if (selectedOptionId && id === selectedOptionId && id !== currentQuestion.correct_option_id) {
                    b.classList.remove('border-blue-500', 'bg-blue-50', 'dark:bg-blue-900/40');
                    b.classList.add('border-red-500', 'bg-red-50', 'dark:border-red-500', 'dark:bg-red-4267');
                }

                b.disabled = true;
                b.classList.add('opacity-70', 'cursor-not-allowed');
            });
        }



        async function handleAnswerClick(optionId, btnEl) {
            if (/*!currentQuestionId || */isAnswerSent) return;
            isAnswerSent = true;
            selectedOptionId = optionId;

            // Визуально подсветить выбранный ответ
            const buttons = answersEl.querySelectorAll('button');
            buttons.forEach(b => {
                b.disabled = true;
                b.classList.add('opacity-70', 'cursor-not-allowed');
            });
            btnEl.classList.add('border-blue-500', 'bg-blue-50', 'dark:bg-blue-900/40');

            try {
                stompClient.publish({
                    destination: '/app/answer',
                    body: JSON.stringify({ chosenOptionIndex: optionId })
                });
                console.log('Ответ принят:', optionId)
            } catch (err) {
                console.error('Ошибка при отправке ответа:', err);
            }

            /*buttons.forEach(b => {
                if (b.dataset.optionId === selectedOptionId) {
                    b.classList.add('border-pink-500', 'bg-pink-50', 'dark:border-pink-900/40', 'dark:bg-pink-900/40');
                }
            });*/
        }

        function tryShowTop() {
            if (!Array.isArray(GAME_RESULT)) {
                return;
            }
            questionTimerEl.classList.add('hidden');
            topButtonEl.classList.remove('hidden');

            if (currentTopMode === 'GAME') {
                questionTextEl.textContent = 'Игра окончена. Топ игроков:';
                renderLeaderboard(GAME_RESULT);
            } else if (currentTopMode === 'GLOBAL' && Array.isArray(GLOBAL_LEADERBOARD)) {
                questionTextEl.textContent = 'Глобальный топ:';
                renderLeaderboard(GLOBAL_LEADERBOARD);
            }
        }

        async function renderLeaderboard(leaderboard) {
            if (timerIntervalId) {
                clearInterval(timerIntervalId);
                timerIntervalId = null;
            }

            questionIndexEl.textContent = 'Результаты игры';
            questionTimerEl.textContent = '';

            if (!Array.isArray(leaderboard)) {
                questionTextEl.textContent = 'Игра окончена. Нет результатов.';
                answersEl.innerHTML = '';
                return;
            }

            if (leaderboard.length === 0) {
                questionTextEl.textContent = 'Игра окончена. Нет результатов.';
                answersEl.innerHTML = '';
                return;
            }

            const table = document.createElement('div');
            table.className = 'w-full flex flex-col gap-2';

            leaderboard.forEach((player, index) => {
                const row = document.createElement('div');
                row.className =
                    'flex items-center justify-between px-4 py-2 rounded-xl ' +
                    (index === 0
                        ? 'bg-yellow-100 dark:bg-yellow-900/40'
                        : 'bg-gray-100 dark:bg-gray-800');

                const left = document.createElement('div');
                left.className = 'flex items-center gap-3';

                const place = document.createElement('span');
                place.className = 'w-6 text-center font-semibold';
                place.textContent = `${index + 1}.`;

                const name = document.createElement('span');
                name.className = 'font-medium';
                name.textContent = player.nickname ?? 'Без имени';

                left.appendChild(place);
                left.appendChild(name);

                const score = document.createElement('span');
                score.className = 'font-semibold';
                score.textContent = `${player.score || player.globalScore} очков`;

                row.appendChild(left);
                row.appendChild(score);
                table.appendChild(row);
            });

            answersEl.innerHTML = '';
            answersEl.appendChild(table);
        }
    </script>
</body>
